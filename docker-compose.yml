

services:
  vue-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_API_URL_DJANGO: ${VITE_BASE_API_URL_DJANGO}
        VITE_GITHUB_OAUTH_CLIENT_ID: ${VITE_GITHUB_OAUTH_CLIENT_ID}
        VITE_GITHUB_OAUTH_CLIENT_SECRET: ${VITE_GITHUB_OAUTH_CLIENT_SECRET}
        VITE_GITHUB_OAUTH_REDIRECT_URL: ${VITE_GITHUB_OAUTH_REDIRECT_URL}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${VITE_GOOGLE_OAUTH_CLIENT_ID}
        VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${VITE_GOOGLE_OAUTH_CLIENT_SECRET}
    ports:
      - "8006:8006"
    restart: unless-stopped
